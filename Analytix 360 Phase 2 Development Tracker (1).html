<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analytix 360 Phase 2 Development Tracker</title>
<meta name="description" content="Analytix 360 Phase 2 Development Tracker">
<style>
:root{--bg:#f4f6fb;--surf:#fff;--surf2:#eef1f8;--tx:#111936;--mu:#5d6788;--bd:#dfe4f0;--ac:#5b5bf0;--ac2:#9b5cf6;--er:#e5484d;--sh:0 6px 24px rgba(30,40,100,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--surf:#131a31;--surf2:#1a2340;--tx:#eef1ff;--mu:#97a2c8;--bd:#263056;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--surf:#131a31;--surf2:#1a2340;--tx:#eef1ff;--mu:#97a2c8;--bd:#263056;--sh:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:24px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:var(--sh)}
.hero h1{margin:0 0 6px;font-size:26px;letter-spacing:-.4px}.hero p{margin:0;opacity:.88;max-width:600px}
.tag{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.btns{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.2);color:#fff}
.btn.p{background:#fff;color:var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.k{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.k small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.8px}.k b{display:block;font-size:28px;margin-top:4px}
.panel{background:var(--surf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.tools{padding:14px;border-bottom:1px solid var(--bd)}
.tools input{width:100%;background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.scroll{overflow-x:auto;max-height:70vh}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--surf2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--mu);padding:12px 14px;white-space:nowrap;z-index:1}
td{padding:13px 14px;border-top:1px solid var(--bd);vertical-align:top}
tr:hover td{background:var(--surf2)}
.t{font-weight:600;min-width:160px}.d{color:var(--mu);font-size:13px;max-width:360px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.act{white-space:nowrap}.act button,.mini{background:none;border:1px solid var(--bd);border-radius:8px;padding:4px 9px;cursor:pointer;margin-right:4px;color:var(--mu)}
.empty{padding:40px;text-align:center;color:var(--mu)}
.modal{position:fixed;inset:0;background:rgba(5,8,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.box{background:var(--surf);border-radius:18px;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:22px;border:1px solid var(--bd)}
.box h2{margin:0 0 14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .w{grid-column:span 2}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:600}
.box input,.box select,.box textarea{width:100%;background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
.crow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.crow select{width:auto;min-width:120px}
.hint{color:var(--mu);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.foot .btn,.box .btn{background:var(--surf2);color:var(--tx)}.foot .btn.p{background:var(--ac);color:#fff}
@media(max-width:560px){.g{grid-template-columns:1fr}.g .w{grid-column:span 1}.hero h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><span class="tag" id="rb">Connecting…</span><h1 id="ht"></h1><p id="hs"></p></div>
    <div class="btns">
      <button class="btn" id="th">◐ Theme</button>
      <button class="btn" id="bh" style="display:none">✎ Edit Header</button>
      <button class="btn" id="bc" style="display:none">▦ Columns</button>
      <button class="btn" id="ba" style="display:none">👥 Access</button>
      <button class="btn p" id="add" style="display:none">+ New Item</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="panel">
    <div class="tools"><input id="q" placeholder="Search…"></div>
    <div class="scroll"><table><thead id="hd"></thead><tbody id="rows"></tbody></table></div>
    <div class="empty" id="empty"></div>
  </div>
</div>
<div class="modal" id="m"><div class="box">
  <h2 id="mt"></h2><div id="mb"></div>
  <div class="foot"><button class="btn" id="cx">Cancel</button><button class="btn p" id="sv">Save</button></div>
</div></div>
<script>
const DEF={header:{title:"Analytix 360 Phase 2 Development Tracker",sub:"Innovations, new features, suggestions and remarks driving the next release."},
cols:[{k:"cat",l:"Category",t:"select",o:"Innovation,Feature,Suggestion,Improvement,Remark"},{k:"title",l:"Title",t:"text",req:1},{k:"desc",l:"Description",t:"long"},{k:"own",l:"Owner",t:"text"},{k:"dr",l:"Date Raised",t:"date"},{k:"rem",l:"Remarks",t:"long"}],roles:{}};
const TY=[["text","Text"],["long","Long text"],["select","Dropdown"],["date","Date"],["number","Number"]];
const PAL=["#9b5cf6","#2f8fe8","#e8930c","#12a36b","#7a869f","#e5484d","#0ea5a4","#d6409f"];
const RN={owner:"Owner",admin:"Admin",user:"User",viewer:"View only"};
let items=[],cfg=JSON.parse(JSON.stringify(DEF)),role="viewer",db=null,U=null,me=null,isOwner=false,canW=true,live=false,failed=false,eid=null,onSave=null;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{if(!d)return"—";const x=new Date(d+"T00:00:00");return isNaN(x)?"—":x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
const hue=v=>{let h=0;for(const c of String(v))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const can={write:()=>["owner","admin","user"].includes(role),del:()=>["owner","admin"].includes(role),cfg:()=>role==="owner"};
const calc=()=>{role=isOwner?"owner":!canW?"viewer":(cfg.roles&&cfg.roles[me])||"user"};
const saveCfg=()=>db.doc("config/main").set(cfg);
const cell=(c,v)=>c.t==="select"?(v?`<span class="pill" style="--c:${hue(v)}">${esc(v)}</span>`:"—"):c.t==="date"?fmt(v):`<div class="${c.k==="title"?"t":"d"}">${esc(v)||"—"}</div>`;
function render(){
  $("ht").textContent=cfg.header.title;$("hs").textContent=cfg.header.sub;
  document.title=cfg.header.title;
  $("rb").textContent=failed?"Offline · sign in via shared link":live?RN[role]:"Connecting…";
  $("add").style.display=live&&can.write()?"":"none";
  for(const [b] of [["bh"],["bc"],["ba"]])$(b).style.display=live&&can.cfg()?"":"none";
  const r=cfg.roles||{},cnt=v=>Object.values(r).filter(x=>x===v).length;
  $("kpis").innerHTML=`<div class="k"><small>Total Items</small><b>${items.length}</b></div><div class="k"><small>Columns</small><b>${cfg.cols.length}</b></div><div class="k"><small>Admins</small><b>${cnt("admin")}</b></div><div class="k"><small>Assigned Users</small><b>${cnt("user")}</b></div>`;
  $("hd").innerHTML=`<tr><th>ID</th>${cfg.cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}<th></th></tr>`;
  const q=$("q").value.toLowerCase();
  const list=items.filter(i=>!q||cfg.cols.map(c=>i[c.k]).join(" ").toLowerCase().includes(q)).sort((a,b)=>(+a.id||0)-(+b.id||0));
  $("empty").textContent=failed?"Live data is unavailable here. Open the shared link and sign in.":!live?"Loading…":"No items to show.";
  $("empty").style.display=list.length?"none":"block";
  $("rows").innerHTML=list.map(i=>`<tr><td>P2-${String(i.id||0).padStart(3,"0")}</td>${cfg.cols.map(c=>`<td>${cell(c,i[c.k])}</td>`).join("")}<td class="act">${can.write()?`<button data-e="${esc(i._k)}">Edit</button>`:""}${can.del()?`<button data-d="${esc(i._k)}">✕</button>`:""}</td></tr>`).join("");
}
function modal(title,html,save,label){
  const mb=$("mb");mb.oninput=mb.onchange=mb.onclick=null;
  $("mt").textContent=title;mb.innerHTML=html;onSave=save;
  $("sv").style.display=save?"":"none";$("sv").textContent=label||"Save";$("m").classList.add("on");
}
const close=()=>$("m").classList.remove("on");
function fail(e){alert(e&&e.code==="invalid_argument"?"You don't have permission to do that.":"Could not save. Please try again.")}
$("cx").onclick=close;$("m").onclick=e=>{if(e.target.id==="m")close()};
$("sv").onclick=async()=>{if(!onSave)return;const b=$("sv");b.disabled=true;try{if(await onSave()!==false)close()}catch(e){fail(e)}b.disabled=false};

function field(c,v){
  const id="f_"+c.k,val=v==null?"":v;
  if(c.t==="long")return `<div class="w"><label>${esc(c.l)}</label><textarea id="${id}" rows="3">${esc(val)}</textarea></div>`;
  if(c.t==="select")return `<div><label>${esc(c.l)}</label><select id="${id}"><option value=""></option>${(c.o||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<option ${x===val?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;
  return `<div class="${c.k==="title"?"w":""}"><label>${esc(c.l)}</label><input id="${id}" type="${c.t==="date"?"date":c.t==="number"?"number":"text"}" value="${esc(val)}"></div>`;
}
function openItem(key){
  const it=items.find(x=>x._k===key)||{};
  modal(key?"Edit Item":"New Item",`<div class="g">${cfg.cols.map(c=>field(c,it[c.k])).join("")}</div>`,async()=>{
    const o={};cfg.cols.forEach(c=>{o[c.k]=$("f_"+c.k).value});
    const t=cfg.cols.find(c=>c.req);if(t&&!String(o[t.k]).trim()){$("f_"+t.k).focus();return false}
    if(key)await db.doc("items/"+key).update(o);
    else{o.id=items.reduce((a,x)=>Math.max(a,+x.id||0),0)+1;await db.collection("items").doc().set(o)}
  });
}
function headerModal(){
  modal("Edit header",`<div class="g"><div class="w"><label>Title</label><input id="h_t" value="${esc(cfg.header.title)}"></div><div class="w"><label>Subtitle</label><textarea id="h_s" rows="2">${esc(cfg.header.sub)}</textarea></div></div>`,async()=>{
    if(!$("h_t").value.trim())return false;
    cfg.header={title:$("h_t").value.trim(),sub:$("h_s").value.trim()};await saveCfg();
  });
}
function colsModal(){
  let d=JSON.parse(JSON.stringify(cfg.cols));
  const draw=()=>{$("mb").innerHTML=`<p class="hint">Rename, retype, add or remove columns. Removing a column hides it for everyone (item data stays stored). The Title column can't be removed.</p>`+d.map((c,i)=>`<div class="crow"><input data-i="${i}" data-f="l" value="${esc(c.l)}" placeholder="Column name"><select data-i="${i}" data-f="t">${TY.map(([v,n])=>`<option value="${v}" ${c.t===v?"selected":""}>${n}</option>`).join("")}</select>${c.t==="select"?`<input data-i="${i}" data-f="o" value="${esc(c.o||"")}" placeholder="Options, comma separated">`:""}${c.req?"":`<button class="mini" data-x="${i}">✕</button>`}</div>`).join("")+`<button class="btn" data-ac="1" style="margin-top:8px">+ Add column</button>`};
  modal("Manage columns","",async()=>{cfg.cols=d.filter(c=>c.l.trim());await saveCfg()});draw();
  const mb=$("mb");
  mb.oninput=e=>{const t=e.target;if(t.dataset.i!=null)d[t.dataset.i][t.dataset.f]=t.value};
  mb.onchange=e=>{if(e.target.dataset.f==="t")draw()};
  mb.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.x!=null){d.splice(+b.dataset.x,1);draw()}
    if(b.dataset.ac){d.push({k:"c"+Date.now().toString(36),l:"New column",t:"text"});draw()}};
}
function accessModal(){
  let r={...(cfg.roles||{})},tm;
  const list=async()=>{const ids=Object.keys(r);const p=ids.length?await U.profiles(ids):{};
    $("al").innerHTML=ids.length?ids.map(id=>`<div class="crow"><b style="flex:1">${esc((p[id]&&p[id].name)||"Someone")}</b><select data-u="${esc(id)}"><option value="admin" ${r[id]==="admin"?"selected":""}>Admin</option><option value="user" ${r[id]==="user"?"selected":""}>User</option><option value="">Remove</option></select></div>`).join(""):`<p class="hint">No one assigned yet. Everyone with edit access is a User by default.</p>`};
  modal("Manage access",`<p class="hint"><b>Owner</b> (you): everything, including header, columns and access.<br><b>Admin</b>: add, edit and delete items.<br><b>User</b>: add and edit items.<br>Anyone with view-only sharing can only read. People must also be shared on this page with Contributor (or Editor) access to save changes.</p><label>Add a person</label><input id="as" placeholder="Search by name…"><div id="ar" style="margin:8px 0 14px"></div><label>People with a role</label><div id="al"></div>`,async()=>{cfg.roles=r;await saveCfg()});
  list();
  const mb=$("mb");
  mb.oninput=e=>{if(e.target.id!=="as")return;clearTimeout(tm);tm=setTimeout(async()=>{const q=e.target.value.trim();if(!q){$("ar").innerHTML="";return}
    const hits=(await U.search(q)).filter(h=>!h.isMe&&!r[h.id]).slice(0,6);
    $("ar").innerHTML=hits.length?hits.map(h=>`<button class="mini" data-a="${esc(h.id)}">+ ${esc(h.name||"Someone")}</button>`).join(""):`<span class="hint">No matches.</span>`},250)};
  mb.onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.a){r[b.dataset.a]="user";$("ar").innerHTML="";$("as").value="";list()}};
  mb.onchange=e=>{const u=e.target.dataset.u;if(u==null)return;if(e.target.value)r[u]=e.target.value;else delete r[u];list()};
}
$("add").onclick=()=>openItem(null);$("bh").onclick=headerModal;$("bc").onclick=colsModal;$("ba").onclick=accessModal;
$("rows").onclick=async e=>{const b=e.target.closest("button");if(!b||!db)return;
  if(b.dataset.e)openItem(b.dataset.e);
  if(b.dataset.d&&confirm("Delete this item for everyone?")){try{await db.doc("items/"+b.dataset.d).delete()}catch(x){fail(x)}}};
$("q").oninput=render;
$("th").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)throw 0;
    db=await claude.use("db");U=await claude.use("user");if(!db||!U)throw 0;
    isOwner=await U.isOwner();me=await U.id();canW=(await U.can("data.write"))!==false;
    db.doc("config/main").onSnapshot(s=>{const d=s.exists?s.data():{};cfg={header:d.header||DEF.header,cols:d.cols&&d.cols.length?d.cols:DEF.cols,roles:d.roles||{}};calc();render()},()=>{});
    db.collection("items").onSnapshot(s=>{items=s.docs.map(x=>({...x.data(),_k:x.id}));live=true;failed=false;calc();render()},()=>{failed=true;live=false;render()});
  }catch(e){failed=true;render()}
})();
</script>
</body>
</html>
